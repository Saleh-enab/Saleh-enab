<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Saleh Enab, Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="#24283B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#BB9AF7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7AA2F7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>

  <!-- node graph motif -->
  <g stroke="#7AA2F7" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M880 70 L980 120 L1080 80 M980 120 L1010 200 L1110 180 M980 120 L900 190"/>
  </g>
  <g fill="#7AA2F7">
    <circle cx="880" cy="70" r="5" fill-opacity="0.7"/>
    <circle cx="980" cy="120" r="8"/>
    <circle cx="1080" cy="80" r="5" fill-opacity="0.7"/>
    <circle cx="1010" cy="200" r="5" fill-opacity="0.7"/>
    <circle cx="1110" cy="180" r="5" fill="#BB9AF7"/>
    <circle cx="900" cy="190" r="5" fill="#BB9AF7"/>
  </g>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="56" font-weight="700" fill="#C0CAF5">Saleh Enab</text>
    <rect x="74" y="138" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="184" font-size="24" fill="#A9B1D6">Backend Engineer · APIs · System Design · Distributed Systems</text>
  </g>
  <text x="72" y="222" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" fill="#565F89">$ go run ./goredis  &amp;&amp;  nest start event-flow</text>
</svg>
